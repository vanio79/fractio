# Fractio Node 1 — seed node (becomes META leader)
#
# Ports:
#   Raft:    8301
#   Client:  9001
#   Web:     9871

[node]
id = 1
host = "127.0.0.1"
raft-port = 8301
client-port = 9001
web-port = 9871
data-dir = "examples/3node-cluster/data/node1"

[storage]
write-buffer-size-mb = 2
block-cache-size-mb = 4