# Fractio Node 2 — joins cluster via Node 1
#
# Ports:
#   Raft:    8302
#   Client:  9002
#   Web:     9872

[node]
id = 2
host = "127.0.0.1"
raft-port = 8302
client-port = 9002
web-port = 9872
data-dir = "examples/3node-cluster/data/node2"

[storage]
write-buffer-size-mb = 2
block-cache-size-mb = 4